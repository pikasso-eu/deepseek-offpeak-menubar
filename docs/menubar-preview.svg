<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a55"/>
      <stop offset="100%" stop-color="#141c2b"/>
    </linearGradient>
    <linearGradient id="menu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#2c3037"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="url(#wall)"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="760" height="26" fill="url(#menu)"/>
  <text x="14" y="18" font-size="12" fill="#e8e8e8"></text>
  <text x="26" y="18" font-size="12" fill="#dcdcdc">Finder</text>
  <text x="76" y="18" font-size="12" fill="#dcdcdc">Ablage</text>
  <text x="122" y="18" font-size="12" fill="#dcdcdc">Bearbeiten</text>

  <!-- right side of the menu bar -->
  <text x="556" y="18" font-size="12" fill="#dcdcdc">􀙇</text>
  <text x="580" y="18" font-size="12" fill="#dcdcdc">􀛨</text>
  <circle cx="640" cy="13" r="4.5" fill="#4cd964"/>
  <text x="650" y="18" font-size="12.5" fill="#ffffff" font-weight="600">6h48</text>
  <text x="702" y="18" font-size="12" fill="#dcdcdc">Mon 20:12</text>

  <!-- dropdown menu -->
  <g filter="url(#shadow)">
    <rect x="470" y="34" width="270" height="300" rx="9" fill="#2f333a" stroke="#4a4f57"/>

    <text x="490" y="60" font-size="12.5" fill="#4cd964" font-weight="700">Off-peak · 50% off</text>
    <text x="490" y="81" font-size="12" fill="#d7d9dd">Cheap for another 6 hours 48 minutes –</text>
    <text x="490" y="98" font-size="12" fill="#d7d9dd">switching to peak at 03:00</text>

    <line x1="482" y1="114" x2="728" y2="114" stroke="#454a52"/>
    <text x="490" y="135" font-size="12" fill="#c9ccd1">Today (Mon 14.09.): Peak 03:00–06:00,</text>
    <text x="490" y="152" font-size="12" fill="#c9ccd1">08:00–12:00 (cheap afterwards)</text>

    <line x1="482" y1="168" x2="728" y2="168" stroke="#454a52"/>
    <text x="490" y="189" font-size="12" fill="#c9ccd1">Now: Monday, 14 September 2026, 20:12</text>
    <text x="490" y="206" font-size="12" fill="#c9ccd1">local · 18:12 UTC</text>

    <line x1="482" y1="222" x2="728" y2="222" stroke="#454a52"/>
    <text x="490" y="243" font-size="12" fill="#eaecef" font-weight="600">Balance: 12.34 $</text>
    <text x="490" y="260" font-size="11.5" fill="#a9adb4">granted 2.00 $ · topped up 10.34 $</text>

    <line x1="482" y1="276" x2="728" y2="276" stroke="#454a52"/>
    <text x="490" y="297" font-size="12" fill="#eaecef" font-weight="600">Usage today: 5 sessions · cost $1.05</text>
    <text x="490" y="314" font-size="11.5" fill="#a9adb4">input 83.7M (99.5% cache) · output 539K</text>
  </g>

  <!-- highlighted menu bar item -->
  <rect x="632" y="1" width="62" height="24" rx="5" fill="#ffffff" opacity="0.14"/>
</svg>
